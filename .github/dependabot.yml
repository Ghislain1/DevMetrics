version: 2

updates:
  # Bun-Projekt: Dependabot pflegt bun.lock über das npm-Ökosystem.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      mui:
        patterns:
          - "@mui/*"
          - "@emotion/*"
      electron:
        patterns:
          - "electron"
          - "electron-vite"
          - "vite"
      typescript:
        patterns:
          - "typescript"
          - "@types/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns:
          - "*"
